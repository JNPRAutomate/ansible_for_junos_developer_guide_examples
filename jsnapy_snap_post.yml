# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Perform JSNAPy Snapshot Tests on Junos Devices
#          > Take and Compare Snapshots
# Page   : 122
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-jsnapy.html
# -----------------------------------------------------------------------------
# Description:
#   Takes a post-maintenance snapshot. Run after jsnapy_snap_pre.yml and
#   before jsnapy_check.yml to perform a full pre/post comparison workflow.
#
# Usage:
#   ansible-playbook jsnapy_snap_post.yml -i <inventory>
# =============================================================================
---
- name: Junos Snapshot Administrator tests
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Take a post-maintenance snapshot
      juniper.device.jsnapy:
         action: "snap_post"
         dir: "~/jsnapy/testfiles"
         config_file: "jsnapy_config_base_tests.yaml"
         logfile: "jsnapy_tests.log"
