# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Configure Junos Devices
#          > How to Commit the Configuration > Commit Confirm
# Page   : 179-180
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-configuration-loading-committing.html
# -----------------------------------------------------------------------------
# Description:
#   Two-task playbook demonstrating the commit confirmed workflow:
#   Task 1 — Load and commit with a 5-minute confirmation window.
#   Task 2 — Confirm the commit with a commit check operation.
#   If confirmation never arrives, the device rolls back automatically.
#
# Usage:
#   ansible-playbook config_commit_confirmed.yml -i <inventory>
# =============================================================================
---
- name: "Load configuration and confirm within 5 minutes"
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: "Load configuration. Wait 10 seconds between check and commit. Confirm within 5
  min."
      juniper.device.config:
         load: "merge"
         format: "text"
         src: "build_conf/{{ inventory_hostname }}/junos.conf"
         check_commit_wait: 10
         confirmed: 5
         comment: "updated using Ansible"
      register: response
    - name: "Print the response"
      ansible.builtin.debug:
         var: response


    - name: "Confirm the commit with a commit check"
      juniper.device.config:
        check: true
        diff: false
        commit: false
      register: response
    - name: "Print the response"
      ansible.builtin.debug:
        var: response
