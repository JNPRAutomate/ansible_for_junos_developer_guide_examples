# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Execute Commands and RPCs on Junos Devices
#          > How to Specify the Format for the Command or RPC Output
# Page   : 61-62
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-commands-rpcs-executing.html
# -----------------------------------------------------------------------------
# Description:
#   Executes two RPCs with a different output format for each. When formats
#   is a list, it must have the same number of entries as the rpcs list.
#
# Usage:
#   ansible-playbook rpc_formats_mixed.yml -i <inventory>
# =============================================================================
---
- name: Get device information
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Get software and system uptime information
      juniper.device.rpc:
         rpcs:
           - "get-software-information"
           - "get-system-uptime-information"
         formats:
           - "text"
           - "json"
      register: junos_result


    - name: Print response
      ansible.builtin.debug:
        var: junos_result
