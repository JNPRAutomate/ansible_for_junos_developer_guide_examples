# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Execute Commands and RPCs on Junos Devices
#          > How to Save the Command or RPC Output to a File > dest_dir
# Page   : 63-64
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-commands-rpcs-executing.html
# -----------------------------------------------------------------------------
# Description:
#   Executes two operational mode commands and saves output for each to a
#   separate file. Files are named: <hostname>_<command>.<format>
#
# Usage:
#   ansible-playbook command_dest_dir.yml -i <inventory>
# =============================================================================
---
- name: Get device information
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Get software and uptime information
      juniper.device.command:
         commands:
           - "show version"
           - "show system uptime"
         dest_dir: "{{ playbook_dir }}"
