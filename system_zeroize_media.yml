# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Restore the Factory-Default Configuration Settings
# Page   : 109
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-system.html
# -----------------------------------------------------------------------------
# Description:
#   Restores all Routing Engines to factory-default configuration AND scrubs
#   all attached storage media using media: True.
#   WARNING: This operation is irreversible and time-consuming.
#
# Usage:
#   ansible-playbook system_zeroize_media.yml -i <inventory>
# =============================================================================
---
- name: Restore Junos devices to factory-default configuration
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Restore device to the factory-default configuration and scrub media
      juniper.device.system:
        action: "zeroize"
        media: True
