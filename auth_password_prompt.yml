# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Authenticate Users Executing Ansible Modules on Junos Devices
#          > How to Authenticate the User Using a Playbook or
#            Command-Line Password Prompt
# Page   : 45-46
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-authenticating-users.html
# -----------------------------------------------------------------------------
# Description:
#   Prompts interactively for the username and password when the playbook
#   is executed. The password is not echoed to the terminal (private: yes).
#   The prompted values are mapped to the user and passwd module parameters.
#
# Usage:
#   ansible-playbook auth_password_prompt.yml -i <inventory>
# =============================================================================
---
- name: Get Device Facts
  hosts: all
  connection: local
  gather_facts: no


  vars_prompt:
    - name: "USERNAME"
      prompt: "Username"
      private: no
    - name: "DEVICE_PASSWORD"
      prompt: "Device password"
      private: yes

  vars:
    user: "{{ USERNAME }}"
    passwd: "{{ DEVICE_PASSWORD }}"

  tasks:
    - name: Retrieve facts from Junos devices
      juniper.device.facts:
         savedir: "{{ playbook_dir }}"
    - name: Print facts
      ansible.builtin.debug:
         var: junos.version
