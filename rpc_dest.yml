# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Execute Commands and RPCs on Junos Devices
#          > How to Save the Command or RPC Output to a File > dest
# Page   : 64
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-commands-rpcs-executing.html
# -----------------------------------------------------------------------------
# Description:
#   Executes two RPCs and saves all output for each device to a single file.
#   {{ inventory_hostname }} differentiates the filename per device.
#
# Usage:
#   ansible-playbook rpc_dest.yml -i <inventory>
# =============================================================================
---
- name: Get device information
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Get software and uptime information
      juniper.device.rpc:
         rpcs:
           - "get-software-information"
           - "get-system-uptime-information"
         dest: "{{ inventory_hostname }}-system-information.xml"
