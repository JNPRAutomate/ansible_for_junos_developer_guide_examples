# =============================================================================
# Source : Ansible for Junos OS Developer Guide
# Section: Use Ansible to Halt, Reboot, or Shut Down Junos Devices
#          > How to Perform a Halt, Reboot, or Shut Down with a Delay or
#            at a Specified Time
# Page   : 77
# URL    : https://www.juniper.net/documentation/us/en/software/junos-ansible/
#          ansible/topics/topic-map/junos-ansible-system.html
# -----------------------------------------------------------------------------
# Description:
#   Reboots all Routing Engines after a 30-minute delay.
#   WARNING: This playbook is disruptive. Verify your inventory before running.
#
# Usage:
#   ansible-playbook system_reboot_in_min.yml -i <inventory>
# =============================================================================
---
- name: Reboot Junos devices
  hosts: dc1
  connection: local
  gather_facts: no


  tasks:
    - name: Reboot all REs in 30 minutes
      juniper.device.system:
        action: "reboot"
        in_min: 30
